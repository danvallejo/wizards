[project]
name = "wizards-events"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
packages = ["app"]
modules = ["seed"]

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Any warning fails the suite, including unclosed sqlite connections (ResourceWarning).
filterwarnings = ["error"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
